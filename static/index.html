<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)" />
    <title>Local AI Transcription Studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try { const th = localStorage.getItem('app-theme'); if (th) document.documentElement.dataset.theme = th; } catch (_) {}
    </script>
    <style>
      /* No CDN / web fonts: the app must work fully offline. */
      :root {
        --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e2e6ec; --border-strong: #c9d0da;
        --text: #0f172a; --muted: #5b6577; --faint: #8a93a3;
        --accent: #0d9488; --accent-hover: #0f766e; --accent-soft: rgba(13,148,136,.10); --on-accent: #ffffff;
        --danger: #e11d48; --danger-soft: rgba(225,29,72,.08); --warn: #d97706; --warn-soft: rgba(217,119,6,.10);
        --amber: #b45309;
        --shadow: 0 1px 2px rgba(15,23,42,.05), 0 4px 16px rgba(15,23,42,.04);
        --radius: 16px; --radius-sm: 10px;
        --font: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
        --header-h: 60px;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b0c10; --surface: #13141a; --surface-2: #0e0f14; --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
          --text: #f4f4f5; --muted: #a1a1aa; --faint: #71717a;
          --accent: #2dd4bf; --accent-hover: #5eead4; --accent-soft: rgba(45,212,191,.12); --on-accent: #042f2e;
          --danger: #fb7185; --danger-soft: rgba(251,113,133,.10); --warn: #fbbf24; --warn-soft: rgba(251,191,36,.10);
          --amber: #fcd34d;
          --shadow: 0 1px 2px rgba(0,0,0,.4);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b0c10; --surface: #13141a; --surface-2: #0e0f14; --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
        --text: #f4f4f5; --muted: #a1a1aa; --faint: #71717a;
        --accent: #2dd4bf; --accent-hover: #5eead4; --accent-soft: rgba(45,212,191,.12); --on-accent: #042f2e;
        --danger: #fb7185; --danger-soft: rgba(251,113,133,.10); --warn: #fbbf24; --warn-soft: rgba(251,191,36,.10);
        --amber: #fcd34d;
        --shadow: 0 1px 2px rgba(0,0,0,.4);
        color-scheme: dark;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
        font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased;
      }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      [hidden] { display: none !important; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      svg.icon { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      /* Header */
      .header {
        position: sticky; top: 0; z-index: 20; height: var(--header-h);
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
        background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
      }
      .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .brand-logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); flex-shrink: 0; }
      .brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .brand p { margin: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

      .pill {
        display: inline-flex; align-items: center; gap: 8px; max-width: 260px;
        padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
        border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
      }
      .pill span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
      .pill[data-state="ready"] { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
      .pill[data-state="ready"] .dot { background: var(--accent); }
      .pill[data-state="warn"] { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
      .pill[data-state="warn"] .dot { background: var(--warn); }
      .pill[data-state="offline"] { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
      .pill[data-state="offline"] .dot { background: var(--danger); }
      .pill[data-state="checking"] .dot { animation: blink 1.2s infinite; }

      .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
      .seg button {
        border: 0; background: transparent; padding: 6px 10px; min-height: 32px; border-radius: 9px;
        font-size: 12px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
      }
      .seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
      .icon-btn {
        width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px;
        border: 1px solid var(--border); background: var(--surface); color: var(--muted);
      }
      .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }

      /* Layout: single scroll column on phone/tablet, two independent panes on laptop+ */
      .layout {
        display: grid; gap: 16px; padding: 16px;
        padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        max-width: 1680px; margin: 0 auto;
      }
      .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
      @media (min-width: 1024px) {
        .layout { grid-template-columns: minmax(380px, 5fr) 7fr; height: calc(100dvh - var(--header-h)); padding: 20px; gap: 20px; }
        .col { overflow-y: auto; min-height: 0; }
        .col-result { overflow: hidden; }
        .col-result .transcript-card { flex: 1; min-height: 0; }
      }

      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
      .card-body { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
      @media (max-width: 480px) { .card-body { padding: 14px; } }
      .section-title { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

      /* Tabs */
      .tabs { display: flex; }
      .tabs .seg { width: 100%; }
      .tabs .seg button { flex: 1; justify-content: center; min-height: 40px; font-size: 13px; }

      /* Drop zone */
      .drop {
        width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        min-height: 168px; padding: 24px 16px; text-align: center;
        border: 2px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface-2);
        transition: border-color .15s, background-color .15s;
      }
      .drop:hover, .drop.dragging { border-color: var(--accent); background: var(--accent-soft); }
      .drop-icon { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); color: var(--accent); }
      .drop-icon svg { width: 24px; height: 24px; }
      .drop strong { font-size: 14px; }
      .drop small { font-size: 12px; color: var(--muted); }

      /* Recorder */
      .recorder { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); text-align: center; }
      .rec-indicator { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
      .rec-indicator svg { width: 28px; height: 28px; }
      .recorder.recording .rec-indicator { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); animation: pulse 1.6s infinite; }
      .rec-timer { font: 700 28px/1 var(--mono); letter-spacing: .04em; }
      .rec-note { margin: 0; font-size: 13px; color: var(--muted); max-width: 36ch; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

      /* Preview */
      .preview { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); }
      .preview-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .preview-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .preview-size { font: 12px var(--mono); color: var(--muted); flex-shrink: 0; }
      .badge { font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); flex-shrink: 0; }
      .badge.video { background: var(--warn-soft); color: var(--amber); }
      .preview audio { width: 100%; height: 44px; }
      .preview video { width: 100%; max-height: min(40vh, 300px); border-radius: var(--radius-sm); background: #000; }
      .link-btn { border: 0; background: none; padding: 6px 4px; color: var(--accent); font-size: 13px; font-weight: 700; flex-shrink: 0; }

      /* Form */
      .fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
      .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .field label { font-size: 12px; font-weight: 700; color: var(--muted); }
      .field small { font-size: 11.5px; color: var(--faint); line-height: 1.4; }
      .control {
        width: 100%; min-height: 42px; padding: 8px 12px; border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong); background: var(--surface); font-size: 14px;
      }
      .control:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
      .combo { position: relative; }
      .combo .control { padding-right: 36px; text-overflow: ellipsis; }
      .combo-chevron { position: absolute; right: 12px; top: 12px; color: var(--muted); pointer-events: none; }
      .combo-list {
        position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0; min-width: 220px;
        margin: 0; padding: 4px; list-style: none; max-height: 300px; overflow-y: auto;
        background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
        box-shadow: 0 12px 32px rgba(15,23,42,.18);
      }
      .combo-list li[role="option"] { display: flex; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
      .combo-list li[role="option"] code { font: 12px var(--mono); color: var(--faint); }
      .combo-list li.active { background: var(--accent-soft); }
      .combo-list li[aria-selected="true"] { color: var(--accent); font-weight: 700; }
      .combo-list li.note { padding: 8px 10px 6px; font-size: 12px; color: var(--faint); border-top: 1px solid var(--border); margin-top: 4px; }
      .combo-list li.note:first-child { border-top: 0; margin-top: 0; }
      .range-row { display: flex; align-items: center; gap: 10px; min-height: 42px; }
      .range-row input { flex: 1; accent-color: var(--accent); }
      .range-row output { font: 700 14px var(--mono); min-width: 2ch; text-align: right; }

      .help { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); font-size: 13px; }
      .help summary { cursor: pointer; padding: 10px 12px; font-weight: 700; color: var(--accent); list-style: none; display: flex; align-items: center; gap: 8px; }
      .help summary::-webkit-details-marker { display: none; }
      .help summary::before { content: "ⓘ"; font-size: 15px; }
      .help summary::after { content: "▾"; margin-left: auto; transition: transform .15s; }
      .help[open] summary::after { transform: rotate(180deg); }
      .help ul { margin: 0; padding: 0 14px 12px 32px; color: var(--muted); line-height: 1.55; }
      .help li + li { margin-top: 6px; }
      .toggles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
      .toggle { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); cursor: pointer; min-height: 56px; }
      .toggle:has(input:disabled) { cursor: not-allowed; opacity: .6; }
      .toggle input { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
      .toggle b { display: block; font-size: 13px; }
      .toggle span span { display: block; font-size: 12px; color: var(--muted); }

      /* Buttons */
      .actions { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
      .actions .btn-primary { grid-column: 1 / -1; }
      @media (min-width: 560px) and (max-width: 1023px), (min-width: 1400px) {
        .actions { grid-template-columns: 2fr 1.4fr 1fr; }
        .actions .btn-primary { grid-column: auto; }
      }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        min-height: 44px; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 700;
        border: 1px solid var(--border); background: var(--surface); color: var(--text); white-space: nowrap;
      }
      .btn:not(:disabled):hover { border-color: var(--border-strong); background: var(--surface-2); }
      .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
      .btn-primary:not(:disabled):hover { background: var(--accent-hover); border-color: var(--accent-hover); }
      .btn-soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
      .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
      .btn-sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }

      /* Progress & alerts */
      .progress { padding: 12px; border-radius: var(--radius-sm); background: var(--accent-soft); display: flex; flex-direction: column; gap: 8px; }
      .progress-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; color: var(--accent); }
      .progress-head span:last-child { font-family: var(--mono); }
      .bar { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
      .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s; }
      .bar.indeterminate > div { width: 35%; animation: slide 1.4s ease-in-out infinite; }
      .progress small { font-size: 12px; color: var(--muted); }
      .alert { padding: 12px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.5; background: var(--danger-soft); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); word-break: break-word; white-space: pre-wrap; }

      .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 12px 16px; font-size: 12px; color: var(--muted); }
      .meta b { color: var(--text); font-weight: 600; }

      /* Results */
      .stats { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
      @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
      .stat { padding: 12px 14px; }
      .stat div:first-child { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
      .stat-note { display: block; margin-top: 2px; font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .stat div:nth-child(2) { margin-top: 2px; font: 800 20px/1.3 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .transcript-card { display: flex; flex-direction: column; overflow: hidden; min-height: 55vh; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
      .toolbar h2 { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
      .toolbar .row { justify-content: flex-end; }
      .output { flex: 1; overflow-y: auto; padding: 8px; overscroll-behavior: contain; }
      .seg-row { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; padding: 10px; border-radius: 10px; align-items: start; }
      .seg-row:hover { background: var(--surface-2); }
      .seg-row + .seg-row { border-top: 1px solid var(--border); }
      .ts {
        border: 0; background: none; padding: 2px 6px; margin: -2px -6px; border-radius: 6px;
        font: 600 12px/1.9 var(--mono); color: var(--accent); white-space: nowrap; text-align: left;
      }
      .ts:not(:disabled):hover { background: var(--accent-soft); }
      .ts:disabled { opacity: 1; cursor: default; }
      .seg-text { font-size: 15px; line-height: 1.65; overflow-wrap: anywhere; }
      .speaker { display: inline-block; margin-right: 6px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
      @media (max-width: 480px) { .seg-row { grid-template-columns: 1fr; } }
      .lang-warn { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 12px 16px; background: var(--warn-soft); border-bottom: 1px solid var(--border); font-size: 13px; }
      .lang-warn p { margin: 0; flex: 1 1 260px; }
      .lang-warn p::before { content: "⚠ "; color: var(--warn); font-weight: 700; }
      .lang-warn .row { justify-content: flex-start; }
      .empty { height: 100%; min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); }
      .empty svg { width: 48px; height: 48px; stroke-width: 1.2; color: var(--faint); margin-bottom: 8px; }
      .empty p { margin: 4px 0 0; font-size: 13px; max-width: 42ch; color: var(--faint); }
      .empty strong { color: var(--muted); }

      .toast {
        position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%);
        padding: 10px 16px; border-radius: 12px; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600;
        box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 50; max-width: calc(100vw - 32px);
      }

      /* Phone header: keep only the essentials */
      @media (max-width: 640px) {
        .brand p, .hide-sm { display: none; }
        .pill { max-width: 120px; padding: 6px 10px; }
      }
      @media (max-width: 380px) { .brand h1 { font-size: 14px; } .pill span:last-child { display: none; } }

      @keyframes blink { 50% { opacity: .3; } }
      @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--danger-soft); } 50% { box-shadow: 0 0 0 12px transparent; } }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
  </head>

    <header class="header">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true"><svg class="icon"><use href="#i-mic"/></svg></div>
        <div style="min-width:0">
          <h1 data-i18n="app.title">Local AI Transcription Studio</h1>
          <p data-i18n="app.tagline"></p>
        </div>
      </div>
      <div class="header-actions">
        <div id="statusPill" class="pill" data-state="checking" role="status" aria-live="polite"><span class="dot"></span><span id="statusText"></span></div>
        <div class="seg" role="group" data-i18n-attr="aria-label:ui.language">
          <button type="button" data-lang="id" aria-pressed="true" lang="id">ID</button>
          <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
        </div>
        <button id="themeBtn" type="button" class="icon-btn" data-i18n-attr="aria-label:ui.theme;title:ui.theme">
          <svg class="icon"><use id="themeIcon" href="#i-moon"/></svg>
        </button>
      </div>
    </header>

    <main class="layout">
      <!-- Source & settings -->
      <section class="col" aria-labelledby="sourceTitle">
        <div class="card">
          <div class="card-body">
            <h2 id="sourceTitle" class="sr-only" data-i18n="source.title"></h2>
            <div class="tabs">
              <div class="seg" role="tablist" data-i18n-attr="aria-label:source.title">
                <button id="tabUpload" type="button" role="tab" aria-selected="true" aria-controls="panelUpload"><svg class="icon"><use href="#i-upload"/></svg><span data-i18n="tab.upload"></span></button>
                <button id="tabRecord" type="button" role="tab" aria-selected="false" aria-controls="panelRecord" tabindex="-1"><svg class="icon"><use href="#i-mic"/></svg><span data-i18n="tab.record"></span></button>
              </div>
            </div>

            <div id="panelUpload" role="tabpanel" aria-labelledby="tabUpload">
              <input id="fileInput" type="file" accept="audio/*,video/*,.aac,.flac,.m4a,.mkv,.mov,.mp3,.mp4,.ogg,.opus,.wav,.webm" hidden />
              <button id="dropZone" type="button" class="drop">
                <span class="drop-icon" aria-hidden="true"><svg class="icon"><use href="#i-file"/></svg></span>
                <strong data-i18n="drop.title"></strong>
                <small id="dropHint"></small>
              </button>
            </div>

            <div id="panelRecord" role="tabpanel" aria-labelledby="tabRecord" hidden>
              <div id="recorder" class="recorder">
                <div class="rec-indicator" aria-hidden="true"><svg class="icon"><use href="#i-mic"/></svg></div>
                <div id="recTimer" class="rec-timer" role="timer">00:00</div>
                <p id="recNote" class="rec-note"></p>
                <div class="row">
                  <button id="recBtn" type="button" class="btn btn-primary"></button>
                  <button id="recCancelBtn" type="button" class="btn" data-i18n="record.cancel" hidden></button>
                </div>
              </div>
            </div>

            <div id="preview" class="preview" hidden>
              <div class="preview-head">
                <span id="previewBadge" class="badge">AUDIO</span>
                <span id="previewName" class="preview-name"></span>
                <span id="previewSize" class="preview-size"></span>
                <button id="changeBtn" type="button" class="link-btn" data-i18n="preview.change"></button>
              </div>
              <audio id="audioEl" controls preload="metadata" hidden></audio>
              <video id="videoEl" controls playsinline preload="metadata" hidden></video>
            </div>

            <h3 class="section-title" data-i18n="settings.title"></h3>
            <div class="fields">
              <div class="field">
                <label for="languageInput" data-i18n="settings.language"></label>
                <div class="combo">
                  <input type="hidden" id="language" value="id" />
                  <input id="languageInput" class="control" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="languageList"
                    autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" data-i18n-attr="placeholder:lang.placeholder" />
                  <svg class="icon combo-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
                  <ul id="languageList" class="combo-list" role="listbox" hidden></ul>
                </div>
                <small data-i18n="settings.languageHint"></small>
              </div>
              <div class="field">
                <label for="task" data-i18n="settings.task"></label>
                <select id="task" class="control">
                  <option value="transcribe" data-i18n="opt.transcribe"></option>
                  <option value="translate" data-i18n="opt.translate"></option>
                </select>
                <small data-i18n="settings.taskHint"></small>
              </div>
              <div class="field">
                <label for="beamSize" data-i18n="settings.beam"></label>
                <div class="range-row">
                  <input id="beamSize" type="range" min="1" max="8" step="1" value="5" />
                  <output id="beamOut" for="beamSize">5</output>
                </div>
                <small data-i18n="settings.beamHint"></small>
              </div>
            </div>

            <details class="help">
              <summary data-i18n="help.title"></summary>
              <ul>
                <li data-i18n="help.locked"></li>
                <li data-i18n="help.mixed"></li>
                <li data-i18n="help.long"></li>
                <li data-i18n="help.auto"></li>
                <li data-i18n="help.check"></li>
              </ul>
            </details>

            <div class="toggles">
              <label class="toggle">
                <input id="vadFilter" type="checkbox" checked />
                <span><b data-i18n="vad.title"></b><span data-i18n="vad.hint"></span></span>
              </label>
              <label class="toggle">
                <input id="diarize" type="checkbox" disabled />
                <span><b data-i18n="diarize.title"></b><span id="diarizeHint"></span></span>
              </label>
            </div>

            <div class="actions">
              <button id="processBtn" type="button" class="btn btn-primary" disabled><svg class="icon"><use href="#i-play"/></svg><span data-i18n="action.start"></span></button>
              <button id="extractBtn" type="button" class="btn btn-soft" disabled><svg class="icon"><use href="#i-music"/></svg><span data-i18n="action.extract"></span></button>
              <button id="resetBtn" type="button" class="btn"><svg class="icon"><use href="#i-reset"/></svg><span data-i18n="action.reset"></span></button>
            </div>

            <div id="progress" class="progress" hidden>
              <div class="progress-head"><span id="progressLabel"></span><span id="progressValue"></span></div>
              <div id="progressBar" class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div></div></div>
              <small data-i18n="progress.note"></small>
            </div>
            <div id="errorBox" class="alert" role="alert" hidden></div>
          </div>
        </div>

        <div class="card meta" id="metaInfo">
          <span><span data-i18n="meta.model"></span>: <b id="metaModel">-</b></span>
          <span><span data-i18n="meta.accel"></span>: <b id="metaAccel">-</b></span>
          <span><span data-i18n="meta.maxUpload"></span>: <b id="metaMax">-</b></span>
        </div>
      </section>

      <!-- Results -->
      <section id="resultSection" class="col col-result" aria-labelledby="resultTitle">
        <div class="stats">
          <div class="card stat"><div data-i18n="stat.duration"></div><div id="statDuration">-</div></div>
          <div class="card stat"><div data-i18n="stat.language"></div><div id="statLanguage" style="color:var(--accent)">-</div><small id="statLanguageNote" class="stat-note"></small></div>
          <div class="card stat"><div data-i18n="stat.segments"></div><div id="statSegments">-</div></div>
          <div class="card stat"><div data-i18n="stat.words"></div><div id="statWords">-</div></div>
        </div>

        <div class="card transcript-card">
          <div class="toolbar">
            <h2 id="resultTitle"><svg class="icon" style="color:var(--accent)"><use href="#i-doc"/></svg><span data-i18n="result.title"></span></h2>
            <div class="row">
              <button id="copyBtn" type="button" class="btn btn-sm" disabled><svg class="icon"><use href="#i-copy"/></svg><span data-i18n="result.copy"></span></button>
              <button id="txtBtn" type="button" class="btn btn-sm" disabled><svg class="icon"><use href="#i-download"/></svg>TXT</button>
              <button id="srtBtn" type="button" class="btn btn-sm btn-soft" disabled><svg class="icon"><use href="#i-download"/></svg>SRT</button>
            </div>
          </div>
          <div id="langWarn" class="lang-warn" role="status" hidden>
            <p id="langWarnText"></p>
            <div class="row">
              <button id="langRetryBtn" type="button" class="btn btn-sm btn-primary"></button>
              <button id="langDismissBtn" type="button" class="btn btn-sm" data-i18n="warn.dismiss"></button>
            </div>
          </div>
          <div id="output" class="output" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <template id="emptyTpl">
      <div class="empty">
        <svg class="icon"><use href="#i-doc"/></svg>
        <strong data-i18n="result.emptyTitle"></strong>
        <p data-i18n="result.emptyBody"></p>
      </div>
    </template>

          'help.long': 'A long part entirely in another language? Its result is unpredictable. Split the file and transcribe each part with its own language.',
          'help.auto': 'Auto detect only listens to the first 30 seconds, then uses that language for the whole file. Choosing the language yourself is more accurate.',
          'help.check': 'When done, the app checks the language at the start, middle and end, and warns you if something does not match (+ a few seconds).',
          'speaker': 'Speaker {n}',
          'speaker.unknown': 'Unknown',
          'err.badType': 'Unsupported file format. Use audio/video such as MP3, WAV, M4A, MP4, MKV.',
          'err.tooBig': 'File too large ({size} MB). Maximum is {mb} MB.',
          'err.network': 'Lost connection to the server. Make sure the app is still running.',
          'err.failed': 'Transcription failed.',
          'err.extractFailed': 'Audio extraction failed.',
        },
      };

      // Keep in sync with ALLOWED_EXTENSIONS in app/config.py.
      const ALLOWED = ['aac', 'flac', 'm4a', 'mkv', 'mov', 'mp3', 'mp4', 'ogg', 'opus', 'wav', 'webm'];
      const VIDEO_EXT = /\.(mp4|mkv|mov|webm)$/i;

      const $ = (id) => document.getElementById(id);
      const store = {
        get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
      };

      const state = {
        lang: store.get('app-lang') || ((navigator.language || '').toLowerCase().startsWith('id') ? 'id' : 'en'),
        health: null, offline: false,
        file: null, objectUrl: null, result: null,
        busy: null, // null | 'transcribe' | 'extract'
        progress: { phase: null, pct: 0, startedAt: 0 },
        rec: { recorder: null, stream: null, timer: null, seconds: 0 },
      };
      if (!I18N[state.lang]) state.lang = 'id';

      function t(key, vars = {}) {
        const s = I18N[state.lang][key] ?? I18N.id[key] ?? key;
        return s.replace(/\{(\w+)\}/g, (_, k) => (vars[k] ?? ''));
      }

      function applyI18n(root = document) {
        root.querySelectorAll('[data-i18n]').forEach((n) => { n.textContent = t(n.dataset.i18n); });
        root.querySelectorAll('[data-i18n-attr]').forEach((n) => {
          n.dataset.i18nAttr.split(';').forEach((pair) => {
            const [attr, key] = pair.split(':');
            n.setAttribute(attr, t(key));
          });
        });
      }

      function render() {
        document.documentElement.lang = state.lang;
        document.title = t('app.title');
        document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
        applyI18n();
        renderStatus();
        renderRecorder();
        renderBusy();
        renderResult();
        renderLangInput();
      }

      // ---------- Formatting ----------
      function formatTime(sec) {
        const s = Number.isFinite(sec) ? Math.max(0, sec) : 0;
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = Math.floor(s % 60);
        const mm = String(m).padStart(2, '0'), ss = String(r).padStart(2, '0');
        return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
      }
      function formatSrtTime(sec) {
        const s = Number.isFinite(sec) ? Math.max(0, sec) : 0;
        const ms = Math.round(s * 1000);
        const p = (n, w = 2) => String(n).padStart(w, '0');
        return `${p(Math.floor(ms / 3600000))}:${p(Math.floor(ms / 60000) % 60)}:${p(Math.floor(ms / 1000) % 60)},${p(ms % 1000, 3)}`;
      }
      function languageName(code, uiLang = state.lang) {
        if (!code) return '-';
        const key = `opt.${code}`;
        if (uiLang === state.lang && I18N[state.lang][key]) return t(key);
        // whisper uses "jw" for Javanese; the ISO code Intl knows is "jv".
        try { return new Intl.DisplayNames([uiLang], { type: 'language' }).of(code === 'jw' ? 'jv' : code) || code.toUpperCase(); }
        catch (_) { return code.toUpperCase(); }
      }
      function speakerLabel(raw) {
        if (!raw) return '';
        const m = /^(?:Pembicara|Speaker)\s*(\d+)$/i.exec(raw);
        if (m) return t('speaker', { n: m[1] });
        return raw === 'Unknown' ? t('speaker.unknown') : raw;
      }
      const maxMb = () => state.health?.max_upload_mb || 0; // 0 = unlimited
      const limitText = () => (maxMb() ? t('limit.max', { mb: maxMb() }) : t('limit.none'));

      // ---------- Theme & language ----------
      function currentTheme() {
        return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }
      function renderThemeIcon() {
        $('themeIcon').setAttribute('href', currentTheme() === 'dark' ? '#i-sun' : '#i-moon');
      }
      $('themeBtn').addEventListener('click', () => {
        const next = currentTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        store.set('app-theme', next);
        renderThemeIcon();
      });
      matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', renderThemeIcon);
      document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => {
        state.lang = b.dataset.lang;
        store.set('app-lang', state.lang);
        render();
      }));

      // ---------- Toast & errors ----------
      let toastTimer;
      function toast(msg) {
        const el = $('toast');
        el.textContent = msg;
        el.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
      }
      function showError(msg) { $('errorBox').textContent = msg; $('errorBox').hidden = false; }
      function clearError() { $('errorBox').hidden = true; $('errorBox').textContent = ''; }

      // ---------- Health ----------
      function renderStatus() {
        const pill = $('statusPill'), text = $('statusText'), h = state.health;
        if (state.offline) { pill.dataset.state = 'offline'; text.textContent = t('status.offline'); pill.title = ''; }
        else if (!h) { pill.dataset.state = 'checking'; text.textContent = t('status.checking'); }
        else if (h.model_loaded) { pill.dataset.state = 'ready'; text.textContent = t('status.ready'); pill.title = `${h.model} · ${h.backend || h.device}`; }
        else { pill.dataset.state = 'warn'; text.textContent = t('status.notReady'); pill.title = h.model_error || ''; }

        $('dropHint').textContent = t('drop.hint', { limit: limitText() });
        $('diarizeHint').textContent = h?.diarization_available ? t('diarize.hint') : t('diarize.unavailable');
        $('diarize').disabled = !h?.diarization_available;
        if (!h?.diarization_available) $('diarize').checked = false;
        $('metaModel').textContent = h?.model || '-';
        $('metaAccel').textContent = h ? `${h.backend || h.device}${h.gpu_device && h.gpu_device !== 'auto' ? ` #${h.gpu_device}` : ''}` : '-';
        $('metaMax').textContent = limitText();
      }

      let healthTimer;
      async function checkHealth() {
        clearTimeout(healthTimer);
        try {
          const res = await fetch('/health', { cache: 'no-store' });
          state.health = await res.json();
          state.offline = false;
        } catch (_) {
          state.offline = true;
        }
        renderStatus();
        // Keep polling until the backend is ready, then check rarely.
        healthTimer = setTimeout(checkHealth, state.health?.model_loaded && !state.offline ? 60000 : 5000);
      }

      // ---------- Tabs ----------
      const tabs = [$('tabUpload'), $('tabRecord')];
      function selectTab(tab) {
        tabs.forEach((b) => {
          const on = b === tab;
          b.setAttribute('aria-selected', String(on));
          b.tabIndex = on ? 0 : -1;
          $(b.getAttribute('aria-controls')).hidden = !on || (b === tabs[0] && !!state.file);
        });
      }
      tabs.forEach((b, i) => {
        b.addEventListener('click', () => selectTab(b));
        b.addEventListener('keydown', (e) => {
          if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
          const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
          selectTab(next);
          next.focus();
        });
      });

      // ---------- File selection ----------
      function setFile(file) {
        if (file) {
          const ext = (file.name.split('.').pop() || '').toLowerCase();
          if (!ALLOWED.includes(ext)) { showError(t('err.badType')); return; }
          const mb = file.size / 1048576;
          if (maxMb() && mb > maxMb()) { showError(t('err.tooBig', { size: mb.toFixed(1), mb: maxMb() })); return; }
        }
        clearError();
        if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
        state.objectUrl = null;
        state.file = file || null;
        const audio = $('audioEl'), video = $('videoEl');
        audio.hidden = video.hidden = true;
        audio.removeAttribute('src'); video.removeAttribute('src');

        if (file) {
          const isVideo = file.type.startsWith('video/') || (!file.type.startsWith('audio/') && VIDEO_EXT.test(file.name));
          state.objectUrl = URL.createObjectURL(file);
          const player = isVideo ? video : audio;
          player.src = state.objectUrl;
          player.hidden = false;
          $('previewBadge').textContent = isVideo ? 'VIDEO' : 'AUDIO';
          $('previewBadge').classList.toggle('video', isVideo);
          $('previewName').textContent = file.name;
          $('previewName').title = file.name;
          $('previewSize').textContent = `${(file.size / 1048576).toFixed(1)} MB`;
        }
        $('preview').hidden = !file;
        $('panelUpload').hidden = !!file || $('tabUpload').getAttribute('aria-selected') !== 'true';
        renderBusy();
        renderResult(); // timestamps become clickable once a player exists
      }

      const fileInput = $('fileInput'), dropZone = $('dropZone');
      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', () => { setFile(fileInput.files[0]); fileInput.value = ''; });
      ['dragenter', 'dragover'].forEach((ev) => dropZone.addEventListener(ev, (e) => { e.preventDefault(); dropZone.classList.add('dragging'); }));
      ['dragleave', 'drop'].forEach((ev) => dropZone.addEventListener(ev, (e) => { e.preventDefault(); dropZone.classList.remove('dragging'); }));
      dropZone.addEventListener('drop', (e) => { if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); });
      // Dropping a file anywhere else must not navigate the browser away and lose the page state.
      ['dragover', 'drop'].forEach((ev) => window.addEventListener(ev, (e) => e.preventDefault()));
      $('changeBtn').addEventListener('click', () => { setFile(null); selectTab($('tabUpload')); fileInput.click(); });

      // ---------- Recording ----------
      const canRecord = window.isSecureContext && !!navigator.mediaDevices?.getUserMedia && typeof MediaRecorder !== 'undefined';
      function pickMime() {
        // audio/mp4 covers Safari on iPhone/iPad.
        return ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'].find((m) => MediaRecorder.isTypeSupported?.(m)) || '';
      }
      function renderRecorder() {
        const recording = state.rec.recorder?.state === 'recording';
        $('recorder').classList.toggle('recording', recording);
        $('recNote').textContent = !canRecord ? t('record.insecure') : t(recording ? 'record.recording' : 'record.idle');
        const btn = $('recBtn');
        btn.disabled = !canRecord || !!state.busy;
        btn.className = `btn ${recording ? 'btn-danger' : 'btn-primary'}`;
        btn.innerHTML = recording ? '<span style="width:10px;height:10px;border-radius:2px;background:currentColor"></span>' : '<svg class="icon"><use href="#i-mic"/></svg>';
        btn.append(t(recording ? 'record.stop' : 'record.start'));
        $('recCancelBtn').hidden = !recording;
      }
      async function startRecording() {
        clearError();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mimeType = pickMime();
          const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
          const chunks = [];
          recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
          recorder.onstop = () => {
            const type = recorder.mimeType || mimeType || 'audio/webm';
            const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
            const stamp = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
            setFile(new File(chunks, `${t('record.fileName')}-${stamp}.${ext}`, { type: type.split(';')[0] }));
          };
          state.rec = { recorder, stream, seconds: 0, timer: setInterval(() => { state.rec.seconds += 1; $('recTimer').textContent = formatTime(state.rec.seconds); }, 1000) };
          $('recTimer').textContent = '00:00';
          recorder.start(1000);
          renderRecorder();
        } catch (err) {
          showError(t('record.denied', { msg: err.message || err.name }));
        }
      }
      function stopRecording(save) {
        const { recorder, stream, timer } = state.rec;
        clearInterval(timer);
        if (recorder && recorder.state !== 'inactive') {
          if (!save) recorder.onstop = null;
          recorder.stop();
        }
        stream?.getTracks().forEach((tr) => tr.stop());
        state.rec = { recorder: null, stream: null, timer: null, seconds: 0 };
        if (!save) $('recTimer').textContent = '00:00';
        renderRecorder();
      }
      $('recBtn').addEventListener('click', () => (state.rec.recorder?.state === 'recording' ? stopRecording(true) : startRecording()));
      $('recCancelBtn').addEventListener('click', () => stopRecording(false));

      // ---------- Progress & busy ----------
      let elapsedTimer;
      function setPhase(phase, pct = 0) {
        state.progress.phase = phase;
        state.progress.pct = pct;
        if (phase !== 'uploading' && !state.progress.startedAt) state.progress.startedAt = Date.now();
        renderProgress();
      }
      function renderProgress() {
        const { phase, pct, startedAt } = state.progress;
        $('progress').hidden = !phase;
        if (!phase) return;
        const bar = $('progressBar');
        const determinate = phase === 'uploading';
        bar.classList.toggle('indeterminate', !determinate);
        bar.firstElementChild.style.width = determinate ? `${pct}%` : '';
        if (determinate) bar.setAttribute('aria-valuenow', String(pct)); else bar.removeAttribute('aria-valuenow');
        $('progressLabel').textContent = t(`progress.${phase}`);
        $('progressValue').textContent = determinate ? `${pct}%` : startedAt ? t('progress.elapsed', { t: formatTime((Date.now() - startedAt) / 1000) }) : '';
      }
      function setBusy(kind) {
        state.busy = kind;
        clearInterval(elapsedTimer);
        if (kind) {
          state.progress.startedAt = 0;
          elapsedTimer = setInterval(renderProgress, 1000);
        } else {
          state.progress.phase = null;
        }
        renderBusy();
        renderRecorder();
      }
      function renderBusy() {
        const busy = !!state.busy;
        $('processBtn').disabled = busy || !state.file;
        $('extractBtn').disabled = busy || !state.file;
        $('resetBtn').disabled = busy;
        $('changeBtn').disabled = busy;
        $('processBtn').querySelector('span').textContent = t(state.busy === 'transcribe' ? 'action.processing' : 'action.start');
        $('extractBtn').querySelector('span').textContent = t(state.busy === 'extract' ? 'action.extracting' : 'action.extract');
        $('langRetryBtn').disabled = busy;
        renderProgress();
      }
      // Warn before closing the tab mid-job; the upload/transcription would be lost.
      window.addEventListener('beforeunload', (e) => { if (state.busy || state.rec.recorder) { e.preventDefault(); e.returnValue = ''; } });

      // ---------- API ----------
      function postForm(url, form, responseType) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', url);
          xhr.responseType = responseType;
          const serverPhase = () => {
            if (state.progress.phase === 'uploading') setPhase(state.busy === 'extract' ? 'extracting' : 'processing');
          };
          // The % only measures the upload. Switch to the server phase as soon as all bytes are sent,
          // since some browsers fire upload.onload late; never fall back to "uploading" afterwards.
          xhr.upload.onprogress = (e) => {
            if (!e.lengthComputable || state.progress.phase !== 'uploading') return;
            if (e.loaded >= e.total) return serverPhase();
            setPhase('uploading', Math.min(99, Math.floor((e.loaded / e.total) * 100)));
          };
          xhr.upload.onload = serverPhase;
          xhr.onreadystatechange = () => { if (xhr.readyState >= 2) serverPhase(); };
          xhr.onload = async () => {
            if (xhr.status >= 200 && xhr.status < 300) return resolve(xhr);
            let msg = '';
            try { msg = responseType === 'blob' ? JSON.parse(await xhr.response.text()).message : xhr.response?.message; } catch (_) {}
            reject(new Error(`[${xhr.status}] ${msg || ''}`.trim()));
          };
          xhr.onerror = () => reject(new Error(t('err.network')));
          xhr.send(form);
        });
      }

      function saveSettings() {
        store.set('app-settings', JSON.stringify({
          language: $('language').value, task: $('task').value, beam: $('beamSize').value, vad: $('vadFilter').checked,
        }));
      }
      function loadSettings() {
        let s = {};
        try { s = JSON.parse(store.get('app-settings') || '{}'); } catch (_) {}
        if (s.language === 'auto' || WHISPER_LANGS.includes(s.language)) $('language').value = s.language;
        if (s.task) $('task').value = s.task;
        if (s.beam) $('beamSize').value = s.beam;
        if (typeof s.vad === 'boolean') $('vadFilter').checked = s.vad;
        $('beamOut').textContent = $('beamSize').value;
      }
      ['task', 'beamSize', 'vadFilter'].forEach((id) => $(id).addEventListener('change', saveSettings));
      $('beamSize').addEventListener('input', () => { $('beamOut').textContent = $('beamSize').value; });

      // ---------- Audio language combobox ----------
      // Every language whisper.cpp accepts for -l (large-v3 list). Only FAVORITES show until the user types.
      const WHISPER_LANGS = ('en zh de es ru ko fr ja pt tr pl ca nl ar sv it id hi fi vi he uk el ms cs ro da hu ta no th ur hr bg lt la mi ml cy sk te fa lv bn sr az sl kn et mk br eu is hy ne mn bs kk sq sw gl mr pa si km sn yo so af oc ka be tg sd gu am yi lo uz fo ht ps tk nn mt sa lb my bo tl mg as tt haw ln ha ba jw su yue').split(' ');
      const FAVORITES = ['id', 'en', 'auto', 'ms', 'jw'];
      const MAX_MATCHES = 8;
      const langInput = $('languageInput'), langList = $('languageList');
      let langOptions = [], langActive = -1;

      const norm = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      function searchLanguages(query) {
        const q = norm(query.trim());
        if (!q) return FAVORITES;
        const scored = [];
        ['auto', ...WHISPER_LANGS].forEach((code) => {
          // Match the name in the UI language, in English and in Indonesian, plus the raw code.
          const names = [languageName(code), languageName(code, 'en'), languageName(code, 'id'), code].map(norm);
          const rank = names.some((n) => n === q) ? 0 : names.some((n) => n.startsWith(q)) ? 1
            : names.some((n) => n.split(/[\s(),-]+/).some((w) => w.startsWith(q))) ? 2 : names.some((n) => n.includes(q)) ? 3 : -1;
          if (rank >= 0) scored.push([rank, code]);
        });
        return scored.sort((a, b) => a[0] - b[0]).slice(0, MAX_MATCHES).map(([, code]) => code);
      }
      function renderLangInput() { langInput.value = languageName($('language').value); }
      function openLangList(query = '') {
        langOptions = searchLanguages(query);
        langActive = langOptions.indexOf($('language').value);
        if (langActive < 0) langActive = langOptions.length ? 0 : -1;
        langList.replaceChildren();
        langOptions.forEach((code, i) => {
          const li = document.createElement('li');
          li.id = `lang-opt-${code}`;
          li.setAttribute('role', 'option');
          li.setAttribute('aria-selected', String(code === $('language').value));
          li.classList.toggle('active', i === langActive);
          const name = document.createElement('span');
          name.textContent = languageName(code);
          const tag = document.createElement('code');
          tag.textContent = code === 'auto' ? '' : code;
          li.append(name, tag);
          // mousedown (not click) so it fires before the input's blur closes the list.
          li.addEventListener('mousedown', (e) => { e.preventDefault(); chooseLanguage(code); });
          langList.append(li);
        });
        const note = document.createElement('li');
        note.className = 'note';
        note.setAttribute('aria-hidden', 'true');
        note.textContent = !query.trim() ? t('lang.more') : langOptions.length ? '' : t('lang.noMatch');
        if (note.textContent) langList.append(note);
        langList.hidden = false;
        langInput.setAttribute('aria-expanded', 'true');
        syncLangActive();
      }
      function closeLangList() {
        langList.hidden = true;
        langInput.setAttribute('aria-expanded', 'false');
        langInput.removeAttribute('aria-activedescendant');
        renderLangInput();
      }
      function syncLangActive() {
        [...langList.querySelectorAll('[role="option"]')].forEach((li, i) => li.classList.toggle('active', i === langActive));
        const active = langOptions[langActive];
        if (active) {
          langInput.setAttribute('aria-activedescendant', `lang-opt-${active}`);
          $(`lang-opt-${active}`).scrollIntoView({ block: 'nearest' });
        } else {
          langInput.removeAttribute('aria-activedescendant');
        }
      }
      function chooseLanguage(code) {
        $('language').value = code;
        saveSettings();
        closeLangList();
      }
      langInput.addEventListener('focus', () => { langInput.select(); openLangList(); });
      langInput.addEventListener('click', () => { if (langList.hidden) openLangList(); });
      langInput.addEventListener('input', () => openLangList(langInput.value));
      langInput.addEventListener('blur', closeLangList);
      langInput.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          if (langList.hidden) return openLangList();
          if (!langOptions.length) return;
          langActive = (langActive + (e.key === 'ArrowDown' ? 1 : -1) + langOptions.length) % langOptions.length;
          syncLangActive();
        } else if (e.key === 'Enter') {
          if (!langList.hidden && langOptions[langActive]) { e.preventDefault(); chooseLanguage(langOptions[langActive]); }
        } else if (e.key === 'Escape') {
          if (!langList.hidden) { e.preventDefault(); closeLangList(); langInput.select(); }
        }
      });

      async function transcribe() {
        if (!state.file || state.busy) return;
        clearError();
        const form = new FormData();
        form.append('file', state.file);
        form.append('language', $('language').value);
        form.append('task', $('task').value);
        form.append('beam_size', $('beamSize').value);
        form.append('vad_filter', String($('vadFilter').checked));
        form.append('diarize', String($('diarize').checked));

        setBusy('transcribe');
        setPhase('uploading', 0);
        try {
          const xhr = await postForm('/api/transcribe', form, 'json');
          const data = xhr.response || {};
          if (data.status !== 'success') throw new Error(data.message || t('err.failed'));
          state.result = data;
          state.result.sourceName = state.file.name;
          state.result.requestedLanguage = form.get('language');
          renderResult();
          toast(t('result.done'));
          if (matchMedia('(max-width: 1023px)').matches) $('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (err) {
          showError(`${t('err.failed')} ${err.message || ''}`.trim());
        } finally {
          setBusy(null);
        }
      }

      async function extractAudio() {
        if (!state.file || state.busy) return;
        clearError();
        const form = new FormData();
        form.append('file', state.file);
        setBusy('extract');
        setPhase('uploading', 0);
        try {
          const xhr = await postForm('/api/extract-audio', form, 'blob');
          const match = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(xhr.getResponseHeader('Content-Disposition') || '');
          let name = `${baseName(state.file.name)}-audio.wav`;
          if (match) { try { name = decodeURIComponent(match[1]); } catch (_) { name = match[1]; } }
          download(xhr.response, name);
          setFile(new File([xhr.response], name, { type: 'audio/wav' }));
        } catch (err) {
          showError(`${t('err.extractFailed')} ${err.message || ''}`.trim());
        } finally {
          setBusy(null);
        }
      }

      $('processBtn').addEventListener('click', transcribe);
      $('extractBtn').addEventListener('click', extractAudio);
      $('resetBtn').addEventListener('click', () => {
        if (state.rec.recorder) stopRecording(false);
        state.result = null;
        setFile(null);
        selectTab($('tabUpload'));
      });

      // ---------- Results ----------
      // Whisper often confuses Indonesian and Malay; treat them as a match to avoid noisy warnings.
      const SIMILAR_LANGS = [['id', 'ms']];
      const sameLang = (a, b) => a === b || SIMILAR_LANGS.some((pair) => pair.includes(a) && pair.includes(b));
      // 'wrong' = every checked part (start/middle/end) is another language -> offer a re-run.
      // 'mixed' = only some parts differ -> the file mixes languages; just tell the user where.
      function languageMismatch(r) {
        const chosen = r?.requestedLanguage;
        if (!chosen || chosen === 'auto' || r.warnDismissed) return null;
        const checks = (r.language_checks || []).filter((c) => c.probability >= 0.5);
        const off = checks.filter((c) => !sameLang(c.language, chosen));
        if (!off.length) return null;
        if (off.length === checks.length && off.every((c) => c.language === off[0].language)) {
          return { kind: 'wrong', chosen, spoken: off[0].language, pct: Math.round(Math.max(...off.map((c) => c.probability)) * 100) };
        }
        return { kind: 'mixed', chosen, parts: off };
      }
      function renderLangWarning() {
        const m = languageMismatch(state.result);
        $('langWarn').hidden = !m;
        if (!m) return;
        const retry = $('langRetryBtn');
        if (m.kind === 'mixed') {
          const parts = m.parts.map((c) => t('warn.part', { t: formatTime(c.at), lang: languageName(c.language) })).join(', ');
          $('langWarnText').textContent = t('warn.mixed', { parts, chosen: languageName(m.chosen) });
          retry.hidden = true;
          return;
        }
        $('langWarnText').textContent = t('warn.lang', { spoken: languageName(m.spoken), chosen: languageName(m.chosen), pct: m.pct });
        retry.textContent = t('warn.retry', { lang: languageName(m.spoken) });
        // Re-running needs the same file still loaded.
        retry.hidden = !(state.file && state.file.name === state.result.sourceName);
        retry.disabled = !!state.busy;
      }
      $('langRetryBtn').addEventListener('click', () => {
        const m = languageMismatch(state.result);
        if (m?.kind !== 'wrong') return;
        $('language').value = m.spoken;
        saveSettings();
        renderLangInput();
        transcribe();
      });
      $('langDismissBtn').addEventListener('click', () => { state.result.warnDismissed = true; renderLangWarning(); });

      function renderResult() {
        renderLangWarning();
        const out = $('output'), r = state.result;
        const hasSegs = !!r?.segments?.length;
        ['copyBtn', 'txtBtn', 'srtBtn'].forEach((id) => { $(id).disabled = !hasSegs; });
        $('statDuration').textContent = r ? formatTime(r.duration) : '-';
        $('statLanguage').textContent = r ? languageName(r.language) : '-';
        $('statLanguageNote').textContent = !r ? '' : r.requestedLanguage && r.requestedLanguage !== 'auto' ? t('stat.locked') : t('stat.auto');
        $('statSegments').textContent = r ? String(r.segments?.length || 0) : '-';
        $('statWords').textContent = r ? String((r.text || '').split(/\s+/).filter(Boolean).length) : '-';

        out.replaceChildren();
        if (!r) {
          const empty = $('emptyTpl').content.cloneNode(true);
          applyI18n(empty);
          out.append(empty);
          return;
        }
        if (!hasSegs) {
          const p = document.createElement('div');
          p.className = 'empty';
          p.textContent = t('result.noSpeech');
          out.append(p);
          return;
        }
        // Seeking only makes sense while the player still holds the transcribed file.
        const player = state.file && state.file.name === r.sourceName ? ($('videoEl').hidden ? $('audioEl') : $('videoEl')) : null;
        const frag = document.createDocumentFragment();
        r.segments.forEach((seg) => {
          const row = document.createElement('div');
          row.className = 'seg-row';
          const ts = document.createElement('button');
          ts.type = 'button';
          ts.className = 'ts';
          ts.textContent = `${formatTime(seg.start)} – ${formatTime(seg.end)}`;
          if (player) {
            ts.title = t('result.seek', { t: formatTime(seg.start) });
            ts.addEventListener('click', () => { player.currentTime = seg.start || 0; player.play().catch(() => {}); });
          } else {
            ts.disabled = true;
          }
          const text = document.createElement('div');
          text.className = 'seg-text';
          if (seg.speaker) {
            const sp = document.createElement('span');
            sp.className = 'speaker';
            sp.textContent = speakerLabel(seg.speaker);
            text.append(sp);
          }
          text.append(seg.text || '');
          row.append(ts, text);
          frag.append(row);
        });
        out.append(frag);
      }

      const baseName = (name) => (name || 'transkrip').replace(/\.[^.]+$/, '');
      const lineFor = (seg) => `${seg.speaker ? `${speakerLabel(seg.speaker)}: ` : ''}${(seg.text || '').trim()}`;
      const asText = () => state.result.segments.map((s) => `[${formatTime(s.start)} - ${formatTime(s.end)}] ${lineFor(s)}`).join('\n');
      const asSrt = () => state.result.segments.map((s, i) => `${i + 1}\n${formatSrtTime(s.start)} --> ${formatSrtTime(s.end)}\n${lineFor(s)}\n`).join('\n');

      function download(blob, name) {
        const url = URL.createObjectURL(blob);
        const a = Object.assign(document.createElement('a'), { href: url, download: name });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      async function copyText(text) {
        // navigator.clipboard only exists on HTTPS/localhost; LAN users on http:// need the fallback.
        if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
        const ta = Object.assign(document.createElement('textarea'), { value: text });
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.append(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        if (!ok) throw new Error('copy failed');
      }

      $('copyBtn').addEventListener('click', async () => {
        try { await copyText(asText()); toast(t('result.copied')); } catch (_) { toast(t('result.copyFail')); }
      });
      $('txtBtn').addEventListener('click', () => download(new Blob([asText()], { type: 'text/plain;charset=utf-8' }), `${baseName(state.result.sourceName)}.txt`));
      $('srtBtn').addEventListener('click', () => download(new Blob([asSrt()], { type: 'application/x-subrip;charset=utf-8' }), `${baseName(state.result.sourceName)}.srt`));

      // ---------- Init ----------
      loadSettings();
      renderThemeIcon();
      render();
      checkHealth();
    </script>
  </body>
</html>
